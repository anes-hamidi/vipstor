name: Build and Private OTA Release

on:
  push:
    branches:
      - master
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      app_type:
        description: 'Application to build'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - staff_app
          - customer_app
      version_name:
        description: 'Version Name (e.g. 1.2.0)'
        required: false
        default: '1.2.0'
      is_mandatory:
        description: 'Force all users to update immediately'
        required: false
        default: false
        type: boolean
      release_notes:
        description: 'Release Notes'
        required: false
        default: 'Automated release build from GitHub Actions'

env:
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

jobs:
  # ============================================================================
  # 1. Build Staff App Android APK (Ubuntu Runner)
  # ============================================================================
  build-staff-android:
    name: Build Staff App APK
    runs-on: ubuntu-latest
    if: github.event.inputs.app_type == 'all' || github.event.inputs.app_type == 'staff_app' || github.event.inputs.app_type == '' || github.event_name == 'push'
    steps:
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android/sdk/ndk
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          df -h

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Build Staff App APK
        run: |
          cd apps/staff_app
          flutter pub get
          flutter build apk --release --split-per-abi --build-number=${{ github.run_number }}

      - name: Archive Staff App APKs
        uses: actions/upload-artifact@v4
        with:
          name: staff-app-android-apk
          path: apps/staff_app/build/app/outputs/flutter-apk/*.apk

      - name: Upload Staff App APK to Supabase
        if: env.SUPABASE_URL != '' && env.SUPABASE_SERVICE_ROLE_KEY != ''
        continue-on-error: true
        run: |
          APK_PATH="apps/staff_app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk"
          if [ ! -f "$APK_PATH" ]; then
            APK_PATH="apps/staff_app/build/app/outputs/flutter-apk/app-release.apk"
          fi
          
          FILE_NAME="staff_app_b${{ github.run_number }}.apk"
          FILE_SIZE=$(stat -c%s "$APK_PATH")
          echo "Uploading $APK_PATH ($FILE_SIZE bytes) to Supabase Storage..."
          
          HTTP_STATUS=$(curl -s -o /tmp/upload_response.json -w "%{http_code}" -X POST \
            "${{ env.SUPABASE_URL }}/storage/v1/object/app-releases/android/$FILE_NAME" \
            -H "apikey: ${{ env.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Authorization: Bearer ${{ env.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Content-Type: application/vnd.android.package-archive" \
            -H "x-upsert: true" \
            --data-binary "@$APK_PATH")
            
          echo "Supabase Storage Upload HTTP Status: $HTTP_STATUS"
          cat /tmp/upload_response.json
          
          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
            DOWNLOAD_URL="${{ env.SUPABASE_URL }}/storage/v1/object/public/app-releases/android/$FILE_NAME"
            echo "Registering app version in Supabase database..."
            curl -s -X POST \
              "${{ env.SUPABASE_URL }}/rest/v1/app_versions" \
              -H "apikey: ${{ env.SUPABASE_SERVICE_ROLE_KEY }}" \
              -H "Authorization: Bearer ${{ env.SUPABASE_SERVICE_ROLE_KEY }}" \
              -H "Content-Type: application/json" \
              -H "Prefer: return=minimal" \
              -d @- <<JSON
            {
              "app_type": "staff_app",
              "platform": "android",
              "version_name": "1.0.0",
              "build_number": ${{ github.run_number }},
              "min_supported_build": 1,
              "download_url": "$DOWNLOAD_URL",
              "release_notes": "Automated Android release build",
              "is_mandatory": false,
              "file_size_bytes": $FILE_SIZE
            }
          JSON
            echo "Successfully registered in Supabase!"
          else
            echo "Warning: Storage upload returned status $HTTP_STATUS"
          fi

  # ============================================================================
  # 2. Build Customer App Android APK (Ubuntu Runner)
  # ============================================================================
  build-customer-android:
    name: Build Customer App APK
    runs-on: ubuntu-latest
    if: github.event.inputs.app_type == 'all' || github.event.inputs.app_type == 'customer_app' || github.event.inputs.app_type == '' || github.event_name == 'push'
    steps:
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android/sdk/ndk
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          df -h

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Build Customer App APK
        run: |
          cd apps/customer_app
          flutter pub get
          flutter build apk --release --split-per-abi --build-number=${{ github.run_number }}

      - name: Archive Customer App APKs
        uses: actions/upload-artifact@v4
        with:
          name: customer-app-android-apk
          path: apps/customer_app/build/app/outputs/flutter-apk/*.apk

  # ============================================================================
  # 3. Build Customer App Web (Ubuntu Runner)
  # ============================================================================
  build-customer-web:
    name: Build Customer App Web
    runs-on: ubuntu-latest
    if: github.event.inputs.app_type == 'all' || github.event.inputs.app_type == 'customer_app' || github.event.inputs.app_type == '' || github.event_name == 'push'
    steps:
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android/sdk/ndk
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          df -h

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable Flutter Web
        run: flutter config --enable-web

      - name: Build Customer App Web
        run: |
          cd apps/customer_app
          flutter pub get
          flutter build web --release --build-number=${{ github.run_number }}

      - name: Archive Customer App Web
        uses: actions/upload-artifact@v4
        with:
          name: customer-app-web
          path: apps/customer_app/build/web

  # ============================================================================
  # 4. Build Staff App Windows Executable (Windows Runner)
  # ============================================================================
  build-staff-windows:
    name: Build Staff App Windows
    runs-on: windows-latest
    if: github.event.inputs.app_type == 'all' || github.event.inputs.app_type == 'staff_app' || github.event.inputs.app_type == '' || github.event_name == 'push'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop

      - name: Build Staff App Windows Release
        run: |
          cd apps/staff_app
          flutter pub get
          flutter build windows --release --build-number=${{ github.run_number }}

      - name: Package Windows Release into ZIP
        shell: pwsh
        run: |
          $zipName = "staff_app_windows_b${{ github.run_number }}.zip"
          Compress-Archive -Path "apps\staff_app\build\windows\x64\runner\Release\*" -DestinationPath "$zipName" -Force

      - name: Archive Windows Release as GitHub Artifact
        uses: actions/upload-artifact@v4
        with:
          name: staff-app-windows-zip
          path: staff_app_windows_*.zip

      - name: Upload Windows ZIP to Supabase
        shell: pwsh
        if: env.SUPABASE_URL != '' && env.SUPABASE_SERVICE_ROLE_KEY != ''
        continue-on-error: true
        run: |
          $zipName = "staff_app_windows_b${{ github.run_number }}.zip"
          $fileSize = (Get-Item $zipName).Length
          $uploadUrl = "${{ env.SUPABASE_URL }}/storage/v1/object/app-releases/windows/$zipName"
          $publicUrl = "${{ env.SUPABASE_URL }}/storage/v1/object/public/app-releases/windows/$zipName"

          Invoke-RestMethod -Uri $uploadUrl -Method Post -Headers @{
            "apikey"        = "${{ env.SUPABASE_SERVICE_ROLE_KEY }}"
            "Authorization" = "Bearer ${{ env.SUPABASE_SERVICE_ROLE_KEY }}"
            "Content-Type"  = "application/zip"
            "x-upsert"      = "true"
          } -InFile $zipName

          $body = @{
            app_type            = "staff_app"
            platform            = "windows"
            version_name        = "1.0.0"
            build_number        = [int]${{ github.run_number }}
            min_supported_build = 1
            download_url        = $publicUrl
            release_notes       = "Automated Windows release build"
            is_mandatory        = $false
            file_size_bytes     = $fileSize
          } | ConvertTo-Json

          Invoke-RestMethod -Uri "${{ env.SUPABASE_URL }}/rest/v1/app_versions" -Method Post -Headers @{
            "apikey"        = "${{ env.SUPABASE_SERVICE_ROLE_KEY }}"
            "Authorization" = "Bearer ${{ env.SUPABASE_SERVICE_ROLE_KEY }}"
            "Content-Type"  = "application/json"
          } -Body $body
