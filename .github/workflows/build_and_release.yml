# =============================================================================
# VIP Smock - build and publish releases
#
# This workflow does not duplicate the build/publish logic: every job calls
# scripts/publish_release.ps1, so local releases and CI releases behave the
# same way.
#
# Required repository secrets:
#   SUPABASE_URL
#   SUPABASE_ANON_KEY
#   SUPABASE_SERVICE_ROLE_KEY
#
# The client apps have no compiled fallback project, so all three must point at
# the same Supabase project. The publisher also rejects a cross-project
# URL/key pair.
#
# Optional Android release-signing secrets. Without them, Android jobs fail
# unless you run with allow_debug_signing = true (unsafe, testing only):
#   ANDROID_KEYSTORE_BASE64      base64 of the .jks file
#   ANDROID_KEYSTORE_PASSWORD    keystore password
#   ANDROID_KEY_PASSWORD         key password
#   ANDROID_KEY_ALIAS            key alias
#
# Optional repository variable (applies to tag releases too):
#   ANDROID_SIGNER_SHA256        pinned APK signer SHA-256 fingerprint
#
# To create ANDROID_KEYSTORE_BASE64 locally:
#   [Convert]::ToBase64String([IO.File]::ReadAllBytes("C:\Users\fethi\keys\vip-release.jks"))
#
# Releases are started manually (Actions > Run workflow) or by pushing a v* tag.
# Pushing to main/master no longer publishes automatically.
# =============================================================================

name: Build and Release

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'What to release'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - staff_android
          - staff_windows
          - customer_android
          - customer_web
      version_name:
        description: 'Version name (x.y.z)'
        required: true
        default: '1.1.0'
        type: string
      build_number:
        description: 'Build number (versionCode). Must exceed the last released build; 0 = auto'
        required: false
        default: '0'
        type: string
      android_abi:
        description: 'Android ABI (universal is larger and may exceed the 50 MB limit)'
        required: true
        default: 'arm64-v8a'
        type: choice
        options:
          - arm64-v8a
          - armeabi-v7a
          - x86_64
          - universal
      min_supported_build:
        description: 'Minimum supported build number (default 1)'
        required: false
        default: '1'
        type: string
      max_upload_mb:
        description: 'Supabase per-file limit in MB (Free 50, Pro 500)'
        required: false
        default: '50'
        type: string
      is_mandatory:
        description: 'Force all users to update immediately'
        required: false
        default: false
        type: boolean
      allow_debug_signing:
        description: 'Allow a debug-signed APK (testing only, breaks OTA signatures)'
        required: false
        default: false
        type: boolean
      allowed_signer_sha256:
        description: 'Optional pinned APK signer SHA-256 fingerprint'
        required: false
        default: ''
        type: string
      release_notes:
        description: 'Release notes'
        required: false
        default: 'Automated release from GitHub Actions'
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  # ===========================================================================
  # 1. Compute the matrix and version (cheap Linux job)
  # ===========================================================================
  plan:
    name: Plan release
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - name: Compute matrix and version
        id: plan
        shell: pwsh
        env:
          TARGET: ${{ inputs.target }}
          VERSION_INPUT: ${{ inputs.version_name }}
        run: |
          $all = @(
            @{ app = 'staff_app';    platform = 'android' },
            @{ app = 'staff_app';    platform = 'windows' },
            @{ app = 'customer_app'; platform = 'android' },
            @{ app = 'customer_app'; platform = 'web' }
          )

          $target = $env:TARGET
          if ($target -eq 'staff_android') {
            $selected = @($all[0])
          }
          elseif ($target -eq 'staff_windows') {
            $selected = @($all[1])
          }
          elseif ($target -eq 'customer_android') {
            $selected = @($all[2])
          }
          elseif ($target -eq 'customer_web') {
            $selected = @($all[3])
          }
          else {
            $selected = $all
          }

          $matrix = @{ include = $selected } | ConvertTo-Json -Compress -Depth 5
          "matrix=$matrix" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

          $version = $env:VERSION_INPUT
          if ([string]::IsNullOrWhiteSpace($version)) {
            $version = $env:GITHUB_REF_NAME
          }
          $version = $version -replace '^v', ''
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Invalid version '$version'. Use x.y.z or dispatch the workflow with a version input."
          }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

  # ===========================================================================
  # 2. Build and publish each target through scripts/publish_release.ps1
  # ===========================================================================
  release:
    name: ${{ matrix.app }} / ${{ matrix.platform }}
    needs: plan
    runs-on: windows-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: Validate required secrets
        shell: pwsh
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          $missing = @(
            foreach ($name in @('SUPABASE_URL', 'SUPABASE_ANON_KEY', 'SUPABASE_SERVICE_ROLE_KEY')) {
              if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
                $name
              }
            }
          )
          if ($missing.Count -gt 0) {
            throw "Missing GitHub Actions secrets: $($missing -join ', '). Add them under Settings > Secrets and variables > Actions."
          }
          Write-Host 'Supabase secrets are present.'

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'
          channel: 'stable'
          cache: true

      - name: Cache Gradle
        if: matrix.platform == 'android'
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Configure Android signing
        if: matrix.platform == 'android'
        shell: pwsh
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:ANDROID_KEYSTORE_BASE64)) {
            Write-Host '::warning::ANDROID_KEYSTORE_BASE64 is not set. The APK will be debug-signed; the publish script will refuse unless allow_debug_signing is enabled.'
            exit 0
          }

          foreach ($name in @('ANDROID_KEYSTORE_PASSWORD', 'ANDROID_KEY_PASSWORD', 'ANDROID_KEY_ALIAS')) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
              throw "Secret $name is required when ANDROID_KEYSTORE_BASE64 is set."
            }
          }

          $keystorePath = Join-Path $env:RUNNER_TEMP 'vip-release.jks'
          [IO.File]::WriteAllBytes($keystorePath, [Convert]::FromBase64String($env:ANDROID_KEYSTORE_BASE64))

          $properties = @(
            "storePassword=$env:ANDROID_KEYSTORE_PASSWORD",
            "keyPassword=$env:ANDROID_KEY_PASSWORD",
            "keyAlias=$env:ANDROID_KEY_ALIAS",
            "storeFile=$($keystorePath.Replace('\', '/'))"
          ) -join "`n"

          $keyPropertiesPath = "apps/${{ matrix.app }}/android/key.properties"
          [IO.File]::WriteAllText($keyPropertiesPath, $properties, [Text.Encoding]::ASCII)
          Write-Host "Wrote $keyPropertiesPath (keystore: $keystorePath)"

      - name: Build and publish
        shell: pwsh
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          VERSION: ${{ needs.plan.outputs.version }}
          BUILD_NUMBER: ${{ inputs.build_number }}
          PLATFORM: ${{ matrix.platform }}
          ANDROID_ABI: ${{ inputs.android_abi }}
          MIN_SUPPORTED_BUILD: ${{ inputs.min_supported_build }}
          MAX_UPLOAD_MB: ${{ inputs.max_upload_mb }}
          IS_MANDATORY: ${{ inputs.is_mandatory }}
          ALLOW_DEBUG_SIGNING: ${{ inputs.allow_debug_signing }}
          ALLOWED_SIGNER_SHA256: ${{ inputs.allowed_signer_sha256 || vars.ANDROID_SIGNER_SHA256 }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
        run: |
          $scriptArgs = @(
            '-AppType', '${{ matrix.app }}',
            '-Platform', '${{ matrix.platform }}',
            '-Version', $env:VERSION
          )

          if (-not [string]::IsNullOrWhiteSpace($env:BUILD_NUMBER) -and $env:BUILD_NUMBER -ne '0') {
            $scriptArgs += @('-BuildNumber', $env:BUILD_NUMBER)
          }
          if ($env:PLATFORM -eq 'android' -and -not [string]::IsNullOrWhiteSpace($env:ANDROID_ABI)) {
            $scriptArgs += @('-AndroidAbi', $env:ANDROID_ABI)
          }
          if (-not [string]::IsNullOrWhiteSpace($env:MIN_SUPPORTED_BUILD)) {
            $scriptArgs += @('-MinSupportedBuild', $env:MIN_SUPPORTED_BUILD)
          }
          if (-not [string]::IsNullOrWhiteSpace($env:MAX_UPLOAD_MB)) {
            $scriptArgs += @('-MaxUploadMB', $env:MAX_UPLOAD_MB)
          }
          if ($env:IS_MANDATORY -eq 'true') {
            $scriptArgs += '-IsMandatory'
          }
          if (-not [string]::IsNullOrWhiteSpace($env:RELEASE_NOTES)) {
            $scriptArgs += @('-Notes', $env:RELEASE_NOTES)
          }
          if ($env:ALLOW_DEBUG_SIGNING -eq 'true') {
            $scriptArgs += '-AllowDebugSigning'
          }
          if (-not [string]::IsNullOrWhiteSpace($env:ALLOWED_SIGNER_SHA256)) {
            $scriptArgs += @('-AllowedSignerSha256', $env:ALLOWED_SIGNER_SHA256)
          }

          Write-Host "Running: ./scripts/publish_release.ps1 $($scriptArgs -join ' ')"
          & pwsh -NoProfile -File ./scripts/publish_release.ps1 @scriptArgs
          if ($LASTEXITCODE -ne 0) {
            throw "publish_release.ps1 failed with exit code $LASTEXITCODE"
          }

      - name: Upload artifact backup
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-${{ matrix.platform }}
          path: |
            apps/${{ matrix.app }}/build/*.apk
            apps/${{ matrix.app }}/build/*.zip
          if-no-files-found: ignore
          retention-days: 14

      - name: Job summary
        if: always()
        shell: pwsh
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          @(
            "### Release: ${{ matrix.app }} / ${{ matrix.platform }}",
            "",
            "- Version: $env:VERSION",
            "- Trigger: ${{ github.event_name }}",
            "- Workflow run: ${{ github.run_number }}"
          ) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
