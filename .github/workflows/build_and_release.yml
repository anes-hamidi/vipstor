name: Build and Private OTA Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      app_type:
        description: 'Application to build'
        required: true
        default: 'staff_app'
        type: choice
        options:
          - staff_app
          - customer_app
      version_name:
        description: 'Version Name (e.g. 1.2.0)'
        required: true
        default: '1.2.0'
      build_number:
        description: 'Build Number (e.g. 15)'
        required: true
        default: '15'
      is_mandatory:
        description: 'Force all users to update immediately'
        required: true
        default: false
        type: boolean
      release_notes:
        description: 'Changelog / Release Notes'
        required: false
        default: '• تحسينات عامة في الأداء وإصلاح الأخطاء'

env:
  FLUTTER_VERSION: '3.24.3'
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

jobs:
  # ============================================================================
  # 1. Build Android APK
  # ============================================================================
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Extract Version Info
        id: version_step
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "VERSION=${{ github.event.inputs.version_name }}" >> $GITHUB_OUTPUT
            echo "BUILD_NUMBER=${{ github.event.inputs.build_number }}" >> $GITHUB_OUTPUT
            echo "APP_TYPE=${{ github.event.inputs.app_type }}" >> $GITHUB_OUTPUT
            echo "IS_MANDATORY=${{ github.event.inputs.is_mandatory }}" >> $GITHUB_OUTPUT
            echo "NOTES<<EOF" >> $GITHUB_OUTPUT
            echo "${{ github.event.inputs.release_notes }}" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          else
            TAG_NAME="${GITHUB_REF#refs/tags/v}"
            echo "VERSION=$TAG_NAME" >> $GITHUB_OUTPUT
            echo "BUILD_NUMBER=$GITHUB_RUN_NUMBER" >> $GITHUB_OUTPUT
            echo "APP_TYPE=staff_app" >> $GITHUB_OUTPUT
            echo "IS_MANDATORY=false" >> $GITHUB_OUTPUT
            echo "NOTES=• تحديث تلقائي برقم الإصدار $TAG_NAME" >> $GITHUB_OUTPUT
          fi

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Android Release APK
        run: |
          flutter build apk --release \
            --build-name=${{ steps.version_step.outputs.VERSION }} \
            --build-number=${{ steps.version_step.outputs.BUILD_NUMBER }}

      - name: Upload APK to Supabase Storage
        run: |
          APK_PATH="build/app/outputs/flutter-apk/app-release.apk"
          FILE_NAME="${{ steps.version_step.outputs.APP_TYPE }}_v${{ steps.version_step.outputs.VERSION }}_b${{ steps.version_step.outputs.BUILD_NUMBER }}.apk"
          FILE_SIZE=$(stat -c%s "$APK_PATH")
          
          # Upload via Supabase Storage REST API
          curl -f -X POST \
            "${{ env.SUPABASE_URL }}/storage/v1/object/app-releases/android/$FILE_NAME" \
            -H "Authorization: Bearer ${{ env.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Content-Type: application/vnd.android.package-archive" \
            -H "x-upsert: true" \
            --data-binary "@$APK_PATH"

          DOWNLOAD_URL="${{ env.SUPABASE_URL }}/storage/v1/object/public/app-releases/android/$FILE_NAME"
          
          # Register in app_versions table
          curl -f -X POST \
            "${{ env.SUPABASE_URL }}/rest/v1/app_versions" \
            -H "apikey: ${{ env.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Authorization: Bearer ${{ env.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=minimal" \
            -d @- <<JSON
          {
            "app_type": "${{ steps.version_step.outputs.APP_TYPE }}",
            "platform": "android",
            "version_name": "${{ steps.version_step.outputs.VERSION }}",
            "build_number": ${{ steps.version_step.outputs.BUILD_NUMBER }},
            "min_supported_build": 1,
            "download_url": "$DOWNLOAD_URL",
            "release_notes": "${{ steps.version_step.outputs.NOTES }}",
            "is_mandatory": ${{ steps.version_step.outputs.IS_MANDATORY }},
            "file_size_bytes": $FILE_SIZE
          }
          JSON

  # ============================================================================
  # 2. Build Windows Executable
  # ============================================================================
  build-windows:
    name: Build Windows Release
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Windows Desktop Release
        run: |
          $ver = if ("${{ github.event_name }}" -eq "workflow_dispatch") { "${{ github.event.inputs.version_name }}" } else { "${{ github.ref_name }}".TrimStart('v') }
          $buildNum = if ("${{ github.event_name }}" -eq "workflow_dispatch") { "${{ github.event.inputs.build_number }}" } else { "$env:GITHUB_RUN_NUMBER" }
          flutter build windows --release --build-name=$ver --build-number=$buildNum

      - name: Package Windows Release into ZIP
        shell: pwsh
        run: |
          $ver = if ("${{ github.event_name }}" -eq "workflow_dispatch") { "${{ github.event.inputs.version_name }}" } else { "${{ github.ref_name }}".TrimStart('v') }
          $buildNum = if ("${{ github.event_name }}" -eq "workflow_dispatch") { "${{ github.event.inputs.build_number }}" } else { "$env:GITHUB_RUN_NUMBER" }
          $zipName = "staff_app_windows_v${ver}_b${buildNum}.zip"
          Compress-Archive -Path "build\windows\x64\runner\Release\*" -DestinationPath "$zipName" -Force

          $fileSize = (Get-Item $zipName).Length
          $uploadUrl = "${{ env.SUPABASE_URL }}/storage/v1/object/app-releases/windows/$zipName"
          $publicUrl = "${{ env.SUPABASE_URL }}/storage/v1/object/public/app-releases/windows/$zipName"

          # Upload ZIP to Supabase Storage
          Invoke-RestMethod -Uri $uploadUrl -Method Post -Headers @{
            "Authorization" = "Bearer ${{ env.SUPABASE_SERVICE_ROLE_KEY }}"
            "Content-Type"  = "application/zip"
            "x-upsert"      = "true"
          } -InFile $zipName

          # Register in public.app_versions
          $notes = if ("${{ github.event_name }}" -eq "workflow_dispatch") { "${{ github.event.inputs.release_notes }}" } else { "تحديث تلقائي لويندوز" }
          $isMandatory = if ("${{ github.event_name }}" -eq "workflow_dispatch") { [bool]::Parse("${{ github.event.inputs.is_mandatory }}") } else { $false }
          
          $body = @{
            app_type            = "staff_app"
            platform            = "windows"
            version_name        = $ver
            build_number        = [int]$buildNum
            min_supported_build = 1
            download_url        = $publicUrl
            release_notes       = $notes
            is_mandatory        = $isMandatory
            file_size_bytes     = $fileSize
          } | ConvertTo-Json

          Invoke-RestMethod -Uri "${{ env.SUPABASE_URL }}/rest/v1/app_versions" -Method Post -Headers @{
            "apikey"        = "${{ env.SUPABASE_SERVICE_ROLE_KEY }}"
            "Authorization" = "Bearer ${{ env.SUPABASE_SERVICE_ROLE_KEY }}"
            "Content-Type"  = "application/json"
          } -Body $body
