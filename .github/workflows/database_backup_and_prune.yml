name: Database Backup & Prune

on:
  schedule:
    # Runs automatically on the 1st of every month at 02:00 UTC
    - cron: '0 2 1 * *'
  workflow_dispatch:
    inputs:
      order_retention_days:
        description: 'Completed orders retention in days (older are archived and pruned)'
        required: true
        default: '60'
      audit_retention_days:
        description: 'Audit log retention in days (older are archived and pruned)'
        required: true
        default: '30'
      telemetry_retention_days:
        description: 'Driver location events retention in days'
        required: true
        default: '7'

jobs:
  backup-and-prune:
    name: Backup Historical Data & Prune Storage
    runs-on: self-hosted

    steps:
      - name: Validate Supabase Secrets
        shell: pwsh
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SUPABASE_URL) -or [string]::IsNullOrWhiteSpace($env:SUPABASE_SERVICE_ROLE_KEY)) {
            Write-Error "SUPABASE_URL or SUPABASE_SERVICE_ROLE_KEY is missing from repository secrets."
            exit 1
          }

      - name: Calculate Cutoff Timestamps
        id: cutoffs
        shell: pwsh
        run: |
          $orderDays = "${{ github.event.inputs.order_retention_days || '60' }}"
          $auditDays = "${{ github.event.inputs.audit_retention_days || '30' }}"
          $telemetryDays = "${{ github.event.inputs.telemetry_retention_days || '7' }}"
          $orderCutoff = (Get-Date).AddDays(-[int]$orderDays).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ')
          $auditCutoff = (Get-Date).AddDays(-[int]$auditDays).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ')
          $telemetryCutoff = (Get-Date).AddDays(-[int]$telemetryDays).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ')
          $timestamp = (Get-Date).ToUniversalTime().ToString('yyyyMMdd_HHmmss')
          "order_cutoff=$orderCutoff" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "audit_cutoff=$auditCutoff" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "telemetry_cutoff=$telemetryCutoff" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "backup_tag=$timestamp" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "order_days=$orderDays" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "audit_days=$auditDays" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "telemetry_days=$telemetryDays" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        shell: pwsh
        run: pip install requests

      - name: Export Archivable Data to JSON
        shell: pwsh
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ORDER_CUTOFF: ${{ steps.cutoffs.outputs.order_cutoff }}
          AUDIT_CUTOFF: ${{ steps.cutoffs.outputs.audit_cutoff }}
          TELEMETRY_CUTOFF: ${{ steps.cutoffs.outputs.telemetry_cutoff }}
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path backup_data | Out-Null

          $baseUrl = $env:SUPABASE_URL.TrimEnd('/')
          $headers = @{
            'apikey' = $env:SUPABASE_KEY
            'Authorization' = "Bearer $env:SUPABASE_KEY"
            'Accept' = 'application/json'
          }

          function Fetch-Paginated {
            param([string]$Endpoint, [hashtable]$QueryParams)
            $limit = 1000
            $offset = 0
            $allRows = @()
            while ($true) {
              $params = @{}
              foreach ($key in $QueryParams.Keys) { $params[$key] = $QueryParams[$key] }
              $params['limit'] = $limit
              $params['offset'] = $offset
              $queryParts = @()
              foreach ($key in $params.Keys) { $queryParts += "$key=$($params[$key])" }
              $query = $queryParts -join '&'
              $url = "$baseUrl/rest/v1/$Endpoint?$query"
              $resp = Invoke-RestMethod -Method Get -Uri $url -Headers $headers -ContentType 'application/json'
              $page = @($resp)
              if ($page.Count -eq 0) { break }
              $allRows += $page
              if ($page.Count -lt $limit) { break }
              $offset += $limit
            }
            return $allRows
          }

          Write-Host "Exporting closed orders before $env:ORDER_CUTOFF..."
          $orders = @(Fetch-Paginated -Endpoint 'orders' -QueryParams @{
            'status' = 'in.(delivered,settled,cancelled)'
            'created_at' = "lt.$env:ORDER_CUTOFF"
            'select' = '*,order_items(*)'
          })
          $orders | ConvertTo-Json -Depth 10 | Set-Content -Path 'backup_data/archived_orders.json' -Encoding utf8
          Write-Host "Exported $($orders.Count) orders."

          Write-Host "Exporting audit logs before $env:AUDIT_CUTOFF..."
          $auditLogs = @(Fetch-Paginated -Endpoint 'audit_log' -QueryParams @{
            'created_at' = "lt.$env:AUDIT_CUTOFF"
            'select' = '*'
          })
          $auditLogs | ConvertTo-Json -Depth 10 | Set-Content -Path 'backup_data/archived_audit_log.json' -Encoding utf8
          Write-Host "Exported $($auditLogs.Count) audit records."

          Write-Host "Exporting telemetry events before $env:TELEMETRY_CUTOFF..."
          $telemetry = @(Fetch-Paginated -Endpoint 'driver_location_events' -QueryParams @{
            'recorded_at' = "lt.$env:TELEMETRY_CUTOFF"
            'select' = '*'
          })
          $telemetry | ConvertTo-Json -Depth 10 | Set-Content -Path 'backup_data/archived_driver_telemetry.json' -Encoding utf8
          Write-Host "Exported $($telemetry.Count) telemetry records."

          $manifest = @{
            exported_at = (Get-Date).ToUniversalTime().ToString('o')
            counts = @{
              orders = $orders.Count
              audit_entries = $auditLogs.Count
              telemetry_events = $telemetry.Count
            }
            cutoffs = @{
              order_cutoff = $env:ORDER_CUTOFF
              audit_cutoff = $env:AUDIT_CUTOFF
              telemetry_cutoff = $env:TELEMETRY_CUTOFF
            }
          }
          $manifest | ConvertTo-Json -Depth 10 | Set-Content -Path 'backup_data/manifest.json' -Encoding utf8

      - name: Compress Backup Archive
        shell: pwsh
        run: |
          tar.exe -czf "vip_database_backup_${{ steps.cutoffs.outputs.backup_tag }}.tar.gz" -C backup_data .
          Get-ChildItem vip_database_backup_*.tar.gz

      - name: Upload Backup Artifact to GitHub Storage
        uses: actions/upload-artifact@v4
        with:
          name: vip-database-backup-${{ steps.cutoffs.outputs.backup_tag }}
          path: vip_database_backup_*.tar.gz
          retention-days: 90

      - name: Execute Prune RPC on Database
        shell: pwsh
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ORDER_DAYS: ${{ steps.cutoffs.outputs.order_days }}
          AUDIT_DAYS: ${{ steps.cutoffs.outputs.audit_days }}
          TELEMETRY_DAYS: ${{ steps.cutoffs.outputs.telemetry_days }}
        run: |
          $ErrorActionPreference = 'Stop'
          $baseUrl = $env:SUPABASE_URL.TrimEnd('/')
          $headers = @{
            'apikey' = $env:SUPABASE_KEY
            'Authorization' = "Bearer $env:SUPABASE_KEY"
            'Content-Type' = 'application/json'
          }
          $payload = @{
            p_order_retention_days = [int]$env:ORDER_DAYS
            p_audit_retention_days = [int]$env:AUDIT_DAYS
            p_telemetry_retention_days = [int]$env:TELEMETRY_DAYS
          }
          $jsonPayload = $payload | ConvertTo-Json
          $result = Invoke-RestMethod -Method Post -Uri "$baseUrl/rest/v1/rpc/rpc_purge_historical_data" -Headers $headers -Body $jsonPayload
          Write-Host "Prune RPC Response: $($result | ConvertTo-Json -Depth 10)"

          $summaryFile = $env:GITHUB_STEP_SUMMARY
          if ($summaryFile) {
            $lines = @(
              "## 🧹 Database Backup & Storage Prune Report",
              "",
              "- **Status:** $($result.status)",
              "- **Orders Purged (> $env:ORDER_DAYS d):** $($result.purged_orders)",
              "- **Order Items Purged:** $($result.purged_order_items)",
              "- **Audit Log Entries Purged (> $env:AUDIT_DAYS d):** $($result.purged_audit_entries)",
              "- **Telemetry Events Purged (> $env:TELEMETRY_DAYS d):** $($result.purged_telemetry_events)",
              "- **Failed Operations Purged (> 14d):** $($result.purged_failed_operations)",
              "- **Executed At:** $($result.executed_at)",
              "",
              "✅ **Pre-purge backup archive successfully saved to GitHub Artifacts (90-day retention).**"
            )
            $lines | Out-File -FilePath $summaryFile -Append -Encoding utf8
          }
