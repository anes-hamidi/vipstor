name: customer_app
description: Algomend — Digital Systems & Enterprise Solutions customer portal
version: 1.0.0
publish_to: none

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  core:
    path: ../../packages/core
  domain:
    path: ../../packages/domain
  data:
    path: ../../packages/data
  ui_kit:
    path: ../../packages/ui_kit
  l10n:
    path: ../../packages/l10n
  crypto: ^3.0.3
  flutter_riverpod: ^2.5.1
  go_router: ^14.0.0
  geolocator: ^12.0.0
  geocoding: ^3.0.0
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  url_launcher: ^6.3.0
  printing: ^5.13.0
  pdf: ^3.10.8
  shared_preferences: ^2.5.6
  cached_network_image: ^3.3.1
  flutter_cache_manager: ^3.4.1
  uuid: ^4.4.0
  package_info_plus: ^10.0.0
  open_filex: ^4.5.0
  path_provider: ^2.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

hooks:
  user_defines:
    sqlite3:
      source: system

flutter:
  uses-material-design: true

