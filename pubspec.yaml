name: vip
description: "Wholesale Shop Management System - Main Workspace Application"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  core:
    path: packages/core
  domain:
    path: packages/domain
  data:
    path: packages/data
  ui_kit:
    path: packages/ui_kit
  l10n:
    path: packages/l10n
  staff_app:
    path: apps/staff_app
  customer_app:
    path: apps/customer_app
  flutter_riverpod: ^2.5.1
  go_router: ^14.0.0
  intl: ^0.20.2
  geolocator: ^12.0.0
  geocoding: ^3.0.0
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  flutter_background_service: ^5.0.5
  wakelock_plus: ^1.2.8
  signature: ^5.4.1
  image_picker: ^1.1.2
  flutter_image_compress: ^2.3.0
  battery_plus: ^6.0.2
  url_launcher: ^6.3.0
  maps_launcher: ^3.0.0+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
